<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Bouda Feedback Kiosk</title>
  <link rel="manifest" href="manifest.json" />

  <!--
    ===============
    STYLY / CSS
    ===============
    • Zvýrazněný brand Bouda Burgers (větší než hlavní nadpis, zelená barva)
    • Zachované popisky pod tlačítky (nezmenšovat, ponechat)
    • Zvětšené poděkování
  -->
  <style>
    :root{
      --tile: clamp(120px, 18vmin, 220px);
      --gap: clamp(12px, 2vmin, 24px);
      --radius: clamp(14px, 2.2vmin, 22px);
      --bg:#000; --text:#fff; --muted:#bfc0c9; --accent:#22c55e;
      --tile-bg:#111; --tile-bg-hover:#151515; --tile-border:#242424;
    }

    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
              font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif}
    body{display:flex;align-items:center;justify-content:center;overflow:hidden}

    .container{width:min(1400px,96vw);padding:clamp(10px,3vmin,40px);display:grid;
               grid-template-rows:auto auto 1fr;row-gap:clamp(8px,1.6vmin,16px);
               justify-items:center;text-align:center}

    /* BRAND - větší než hlavní nadpis */
    .brand{color:var(--accent);text-transform:uppercase;letter-spacing:.2em;
           font-weight:900;font-size:clamp(40px,8vmin,96px);}

    h1{margin:.1em 0 0;font-weight:800;font-size:clamp(28px,5vmin,60px);line-height:1.06}
    .sub{margin:.2em 0 0;color:var(--muted);font-size:clamp(16px,3vmin,28px)}

    .grid{margin-top:clamp(12px,2.2vmin,24px);display:grid;
          grid-template-columns:repeat(auto-fit,minmax(var(--tile),1fr));
          gap:var(--gap);width:100%;place-items:center}

    .cell{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vmin,12px)}

    .btn{width:var(--tile);height:var(--tile);border:none;cursor:pointer;border-radius:var(--radius);
         background:var(--tile-bg);box-shadow:0 0 0 1px var(--tile-border);
         display:grid;place-items:center;transition:transform .06s ease,background .15s,box-shadow .15s;
         will-change:transform}
    .btn:hover{background:var(--tile-bg-hover);box-shadow:0 0 0 1px #2d2d2d}
    .btn:active{transform:scale(.965)}

    .emoji{font-size:calc(var(--tile) * .55);line-height:1}

    /* POPISKY – zachovány, neměnit */
    .label{color:var(--muted);font-size:clamp(14px,1.9vmin,20px);white-space:nowrap}

    .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.62);
             opacity:0;pointer-events:none;transition:opacity .12s ease}
    .overlay.show{opacity:1;pointer-events:auto}

    .thanks{font-size:clamp(34px,6vmin,72px);
            padding:clamp(10px,1.6vmin,18px) clamp(16px,2.4vmin,28px);
            border-radius:var(--radius);color:#eaffea;
            border:1px solid rgba(34,197,94,.6);
            background:#0d1a0f;transform:scale(.96);opacity:0;transition:transform .12s,opacity .12s}
    .overlay.show .thanks{transform:scale(1);opacity:1}
  </style>
</head>
<body>
  <main class="container" aria-live="polite">
    <div class="brand">🍔 BOUDA&nbsp;BURGERS</div>
    <h1>Ohodnoť dnešní nákup</h1>
    <p class="sub">Jak spokojený/á jsi byl/a s nákupem?</p>

    <!-- Zachované popisky u tlačítek -->
    <section id="grid" class="grid">
      <div class="cell"><button class="btn" data-value="5" title="Velmi spokojený"><span class="emoji">😁</span></button><div class="label">Velmi spokojený</div></div>
      <div class="cell"><button class="btn" data-value="4" title="Spokojený"><span class="emoji">🙂</span></button><div class="label">Spokojený</div></div>
      <div class="cell"><button class="btn" data-value="3" title="Neutrální"><span class="emoji">😐</span></button><div class="label">Neutrální</div></div>
      <div class="cell"><button class="btn" data-value="2" title="Nespokojený"><span class="emoji">🙁</span></button><div class="label">Nespokojený</div></div>
      <div class="cell"><button class="btn" data-value="1" title="Velmi nespokojený"><span class="emoji">😡</span></button><div class="label">Velmi nespokojený</div></div>
    </section>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="thanks">Děkujeme za zpětnou vazbu!</div>
  </div>
</body>
</html>
