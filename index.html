<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Bouda Feedback Kiosk</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    /* Zákaz výběru a dlouhého podržení (blokuje „Vyhledat“) */
    html, body, * {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    img, svg, button { -webkit-user-drag: none; user-drag: none; -webkit-touch-callout: none; }
    /* Pro jistotu deaktivuj odkazy */
    a, [role="link"] { pointer-events: none !important; }

    :root{
      --tile: clamp(160px, 26vh, 260px);
      --gap: clamp(12px, 2vmin, 24px);
      --radius: clamp(14px, 2.2vmin, 22px);

      /* Palette */
      --bg-1: #060607;
      --bg-2: #0f1012;
      --accent:#f0a344;
      --muted:#b3b3b3;
      --text:#ffffff;

      --tile-bg:#15171a;
      --tile-bg-hover:#1b1d21;
      --tile-border:#2a2d32;
      --glass: rgba(255,255,255,0.03);
      --noise-opacity: 0.03;
    }

    html, body {
      height:100%;
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }

    /* Dekorativní vrstvy pozadí (jemné, neinteraktivní) */
    body::before,
    body::after {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
    }

    /* jemný vignette + spotlight */
    body::before{
      background:
        radial-gradient(60% 40% at 50% 10%, rgba(255,255,255,0.02), transparent 10%),
        radial-gradient(40% 30% at 80% 70%, rgba(255,255,255,0.02), transparent 8%),
        radial-gradient(50% 35% at 20% 70%, rgba(255,255,255,0.015), transparent 12%),
        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.28) 90%);
      mix-blend-mode: overlay;
      opacity:0.95;
    }

    /* tenké diagonály a noise */
    body::after{
      background:
        linear-gradient(135deg, rgba(255,255,255,0.02) 0, rgba(255,255,255,0.02) 30%, transparent 30%),
        linear-gradient(120deg, rgba(240,163,68,0.02) 0, transparent 40%),
        repeating-linear-gradient(90deg, rgba(255,255,255,var(--noise-opacity)) 0 1px, transparent 1px 6px);
      opacity:0.95;
      mix-blend-mode: soft-light;
      transform: scale(1.02);
      filter: blur(0.6px) saturate(0.98);
    }

    /* jemné zrnění přes obsah pro „materiálový“ look */
    .noise {
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><filter id="n"><feTurbulence baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.06" fill="%23000000"/></svg>');
      opacity:0.6;
      mix-blend-mode: overlay;
    }

    .container{
      width:min(1400px,96vw);
      padding:clamp(14px,3vmin,48px);
      display:grid;
      grid-template-rows:auto auto auto;
      row-gap:clamp(8px,1.6vmin,20px);
      justify-items:center;
      text-align:center;
      position:relative;
      z-index:2; /* nad dekoracemi */
    }

    /* jemný glass panel za gridem pro separaci */
    .panel {
      position:absolute;
      left:50%;
      top:30%;
      transform:translateX(-50%);
      width:92%;
      max-width:1200px;
      height:36%;
      border-radius:24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 10px 40px rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.03);
      z-index:1;
      pointer-events:none;
      backdrop-filter: blur(6px) saturate(0.9);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.65) 35%, rgba(0,0,0,0.0) 100%);
    }

    .brand{
      color:var(--accent);
      text-transform:uppercase;
      letter-spacing:.2em;
      font-weight:800;
      font-size:clamp(28px,8vmin,92px)
    }

    h1{
      margin:clamp(12px,2vmin,20px) 0 0;
      font-weight:900;
      font-size:clamp(28px,6.2vmin,64px);
      line-height:1.02;
      text-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .sub{
      margin:.6em 0 0;
      color:var(--muted);
      font-size:clamp(16px,3vmin,22px)
    }

    .grid{
      margin-top:clamp(28px,4vmin,36px);
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(var(--tile),1fr));
      gap:var(--gap);
      width:100%;
      place-items:center;
      z-index:3;
    }
    .cell{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(6px,1.2vmin,12px)
    }
    .btn{
      width:var(--tile);
      height:var(--tile);
      border:none;
      cursor:pointer;
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      box-shadow:
        0 0 0 1px var(--tile-border),
        0 8px 36px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.02);
      display:grid;
      place-items:center;
      transition:transform .12s cubic-bezier(.2,.9,.2,1), background .15s, box-shadow .15s;
      will-change:transform;
      position:relative;
      z-index:3;
      overflow:visible;
    }
    .btn::after{
      /* subtilní glow při hover (není JS) */
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      opacity:0;
      transition:opacity .18s;
      pointer-events:none;
    }
    .btn:hover{ transform: translateY(-6px) scale(1.01); background:var(--tile-bg-hover); box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
    .btn:hover::after{ opacity:0.06; }

    .emoji{
      font-size:calc(var(--tile) * .7); /* velicí smajlíci i na PC */
      line-height:1;
      display:block;
      width:72%; height:72%;
    }
    .face-img{
      width:72%;
      height:72%;
      object-fit:contain;
      pointer-events:none;
      display:block;
    }
    .label{
      color:var(--muted);
      font-size:clamp(13px,1.6vmin,18px);
      white-space:nowrap;
      margin-top:8px;
      z-index:3;
    }

    /* Overlay / thanks: VŽDY NAD VŠÍM */
    .overlay{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      background:rgba(0,0,0,0.45);
      opacity:0;
      pointer-events:none;
      transition:opacity .12s ease;
      z-index:10000; /* důležité: nahoře */
    }
    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .thanks{
      font-size:clamp(30px,6.6vmin,84px);
      line-height:1.02;
      padding:clamp(12px,2vmin,22px) clamp(20px,3vmin,36px);
      border-radius:30px;
      color:#fff;
      border:1px solid rgba(240,163,68,0.12);
      background: linear-gradient(180deg, rgba(24,18,10,0.96), rgba(12,8,6,0.96));
      box-shadow: 0 18px 60px rgba(3,3,3,0.75), 0 2px 0 rgba(255,255,255,0.02) inset;
      transform:translateY(6px) scale(.98);
      opacity:0;
      transition:transform .18s cubic-bezier(.2,.9,.2,1), opacity .18s;
      z-index:10001;
      max-width:92%;
      text-align:center;
      font-weight:800;
      letter-spacing: -0.02em;
    }
    .overlay.show .thanks{
      transform:translateY(0) scale(1);
      opacity:1;
    }

    /* Install button */
    #installBtn{
      position:fixed;
      right:12px;
      bottom:12px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.04);
      background:rgba(255,255,255,0.03);
      color:#fff;
      font-size:14px;
      display:none;
      z-index:10002;
      backdrop-filter: blur(6px);
    }

    /* Responsivita: menší rozestupy na mobilu */
    @media (max-width:720px){
      .panel{ display:none; }
      .grid{ margin-top:18px; gap:12px; }
      .thanks{ font-size:clamp(22px,8vw,36px); padding:10px 16px; border-radius:16px; }
    }

  </style>
</head>
<body>
  <!-- Dekorativní noise vrstva -->
  <div class="noise" aria-hidden="true"></div>

  <!-- jemný glass panel pro pozadí tlačítek -->
  <div class="panel" aria-hidden="true"></div>

  <main class="container" aria-live="polite">
    <!-- GRID: 1 (nejhorší) → 5 (nejlepší) zleva doprava -->
    <section id="grid" class="grid">
      <div class="cell">
        <button class="btn" data-value="1" title="Velmi nespokojený">
          <span class="emoji">😡</span>
        </button>
        <div class="label">Velmi nespokojený</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="2" title="Nespokojený">
          <span class="emoji">🙁</span>
        </button>
        <div class="label">Nespokojený</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="3" title="Neutrální">
          <span class="emoji">😐</span>
        </button>
        <div class="label">Neutrální</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="4" title="Spokojený">
          <span class="emoji">🙂</span>
        </button>
        <div class="label">Spokojený</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="5" title="Velmi spokojený">
          <span class="emoji">😁</span>
        </button>
        <div class="label">Velmi spokojený</div>
      </div>
    </section>

    <!-- TEXT POD SMAJLÍKY -->
    <h1>Ohodnoť dnešní nákup</h1>
    <p class="sub">Jak spokojený/á jsi byl/a s nákupem?</p>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="thanks" role="status" aria-live="polite">Děkujeme za zpětnou vazbu!</div>
  </div>

  <button id="installBtn">Instalovat</button>
  
<script>
/* ========= ROBUSTNÍ ZÁMEK ZPĚT + AUTO OBNOVA + FULLSCREEN ========= */

/* 0) Pomocný flag pro PWA (instalovaná vs. prohlížeč) */
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || (window.navigator.standalone === true);

/* 1) Vynucený hash, aby historie měla co „držet“ */
(function ensureHash(){
  if (!location.hash) {
    history.replaceState(null, '', location.pathname + '#home');
  }
})();

/* 2) Pevné „vycpání“ historie (2 položky) a tvrdé vracení vpřed */
function hardenBackLock() {
  try {
    if (!sessionStorage.getItem('backArmed')) {
      history.pushState({b:1}, '');
      history.pushState({b:2}, '');
      sessionStorage.setItem('backArmed','1');
    }
  } catch(_) {}
  window.addEventListener('popstate', (e)=>{
    // nedovolit odejít zpět – skoč rovnou dopředu
    try { history.go(1); } catch(_) {}
    // pro jistotu historii zase „dotuč“
    try { history.pushState({b:3}, ''); } catch(_) {}
  });
}
window.addEventListener('load', hardenBackLock);

/* 3) Držet fullscreen vždy, když se appka zviditelní */
async function ensureFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
  } catch(_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') ensureFullscreen();
});
window.addEventListener('pageshow', () => {
  // po návratu z BFCache znovu vycpeme historii a fullscreen
  hardenBackLock();
  ensureFullscreen();
});

/* 4) Watchdog: když se náhodou dostaneme na splash/mezistav,
      rychle a potichu obnov domovskou obrazovku */
let lastUserTick = performance.now();
document.addEventListener('pointerdown', ()=> lastUserTick = performance.now(), {passive:true});
document.addEventListener('keydown',     ()=> lastUserTick = performance.now(), {passive:true});

function softRecover(){
  // Pokud jsme „viditelní“, ale UI není interaktivní, přepíšeme url zpět na #home
  if (document.visibilityState === 'visible' && document.readyState !== 'loading') {
    if (!location.hash || location.hash !== '#home') {
      history.replaceState(null, '', location.pathname + '#home');
    }
    hardenBackLock();
    ensureFullscreen();
  }
}
document.addEventListener('visibilitychange', softRecover);
setInterval(softRecover, 1200); // jemný watchdog každých ~1.2 s

/* 5) (Volitelné) Zablokovat Backspace/Escape jako „zpět“ v některých klávesnicích */
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Backspace' || e.key === 'Escape') {
    e.preventDefault();
  }
}, {passive:false});
</script>

<script>
/*** Webhook ***/
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxKT5x3dK3TIe77wfnG7tGTkOy7ftzil1hp0loCIVl9IC1sDOLRyenqtj70a4XBmvkb/exec";

/*** UX parametry ***/
const COOLDOWN_MS = 15000;
const THANKS_MS   = 15000;

/*** Outbox (tichý) ***/
const BOX_KEY = "bouda_outbox_pwa";
const readBox = () => JSON.parse(localStorage.getItem(BOX_KEY) || "[]");
const writeBox = (v)=> localStorage.setItem(BOX_KEY, JSON.stringify(v));

let flushing = false;
async function flushBox(){
  if(flushing || !navigator.onLine) return;
  const box = readBox(); if(!box.length) return;
  flushing = true;
  try{
    while(box.length && navigator.onLine){
      const p = box[0];
      await fetch(WEBHOOK_URL, {
        method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain" },
        body: JSON.stringify(p), keepalive:true
      });
      box.shift(); writeBox(box);
    }
  }catch(_){}
  finally{ flushing = false; }
}
window.addEventListener("online", flushBox);

/*** „Děkujeme“ + cooldown ***/
const overlay = document.getElementById('overlay');
const grid    = document.getElementById('grid');
let cooldownUntil = 0;
const canVote = () => performance.now() >= cooldownUntil;
function startCooldown(){ cooldownUntil = performance.now() + COOLDOWN_MS; grid.style.pointerEvents="none"; setTimeout(()=>grid.style.pointerEvents="auto", COOLDOWN_MS); }
function showThanks(){ overlay.classList.add('show'); setTimeout(()=> overlay.classList.remove('show'), THANKS_MS); }

/*** Hlasování ***/
function sendOrQueue(payload){
  if(!navigator.onLine){
    const b = readBox(); b.push(payload); writeBox(b);
  } else {
    fetch(WEBHOOK_URL, {
      method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain" },
      body: JSON.stringify(payload), keepalive:true
    }).catch(() => {
      const b = readBox(); b.push(payload); writeBox(b);
    });
  }
  flushBox();
}
function vote(value){
  if(!canVote()) return;
  startCooldown(); showThanks();
  const payload = { time:new Date().toISOString(), value:Number(value), kiosk:"Bouda-kiosek-Mercury", question:"Ohodnoť dnešní nákup" };
  sendOrQueue(payload);
}
document.querySelectorAll('.btn').forEach(b=> b.addEventListener('click', ()=> vote(b.dataset.value), {passive:true}));

/*** Fullscreen + WakeLock po prvním kliknutí ***/
async function enterFullscreenAndWake() {
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch(_) {}
  try {
    if ('wakeLock' in navigator) {
      window._wl = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async ()=>{
        if (document.visibilityState === 'visible') {
          try { window._wl = await navigator.wakeLock.request('screen'); } catch(_){}
        }
      });
    }
  } catch(_) {}
}
document.addEventListener('click', function once(){
  enterFullscreenAndWake();
  document.removeEventListener('click', once, {capture:true});
}, {capture:true, once:true});

/*** PWA: registrace SW ***/
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

/*** PWA: tlačítko „Instalovat“ ***/
let defPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  defPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async ()=>{
  if(!defPrompt) return;
  defPrompt.prompt();
  await defPrompt.userChoice;
  defPrompt = null;
  installBtn.style.display = 'none';
});

/*** první tichý flush po startu ***/
flushBox();

/*** Dynamické face1–face5 (fallback na emoji) ***/
(function setupFaces(){
  const exts = ['.png','.webp','.jpg','.jpeg','.svg'];
  document.querySelectorAll('.btn').forEach(btn=>{
    const val = btn.dataset.value;
    const emojiSpan = btn.querySelector('.emoji');
    if(!emojiSpan) return;

    (async () => {
      for(const ext of exts){
        const src = `face${val}${ext}`;
        const ok = await new Promise(res=>{
          const img = new Image();
          img.onload = ()=>res(true);
          img.onerror = ()=>res(false);
          img.src = src;
        });
        if(ok){
          const imgEl = document.createElement('img');
          imgEl.src = src;
          imgEl.alt = `Hodnocení ${val}`;
          imgEl.className = 'face-img';
          emojiSpan.replaceWith(imgEl);
          break;
        }
      }
      // když nic nenajdeme, emoji zůstane
    })();
  });
})();
</script>
</body>
  <script>
// 1) Zruš context menu, výběr, drag & drop
addEventListener('contextmenu', e => e.preventDefault(), {capture:true});
addEventListener('selectstart', e => e.preventDefault(), {capture:true});
addEventListener('dragstart',  e => e.preventDefault(), {capture:true});
addEventListener('copy',       e => e.preventDefault(), {capture:true});
addEventListener('cut',        e => e.preventDefault(), {capture:true});
addEventListener('paste',      e => e.preventDefault(), {capture:true});

// 2) Zneškodni odkazy a okna
addEventListener('click', e => {
  const a = e.target.closest('a, [role="link"], [onclick]');
  if (a) e.preventDefault();
}, {capture:true});
window.open = function(){ return null; };

// 3) Tvrdé „Back lock“ + auto-recovery
(function(){
  try { for (let i=0;i<8;i++) history.pushState({k:i}, ''); } catch(_){}
  addEventListener('popstate', e=>{ try{ history.go(1); }catch(_){ } }, {capture:true});
  if (!location.hash) { try { history.replaceState(null, '', location.pathname + '#home'); } catch(_){ } }
  const recover=()=>{ if (document.visibilityState==='visible') {
    try { history.replaceState(null, '', location.pathname + '#home'); } catch(_){ }
  }};
  addEventListener('visibilitychange', recover);
  setInterval(recover, 1000);
})();
</script>
