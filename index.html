<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Bouda Feedback Kiosk</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    /* Zákaz výběru a dlouhého podržení */
    html, body, * {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    img, svg, button { -webkit-user-drag: none; user-drag: none; -webkit-touch-callout: none; }
    a, [role="link"] { pointer-events: none !important; }

    :root{
      --gap: clamp(12px, 2vmin, 28px);
      --radius: clamp(14px, 2.2vmin, 24px);
      --bg:#000; --text:#fff; --muted:#bfc0c9; --accent:#f0a344;
      --tile-bg:#111; --tile-bg-hover:#151515; --tile-border:#242424;
      --green:#00994a; --yellow:#e1b62f;
      --container-max-width: 1400px;
    }

    html{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
    }
    body{
      min-height:100vh;
      margin:0;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }

    /* INLINE SVG pozadí (mikádo) */
    .spikes{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
    }

    .container{
      width:min(var(--container-max-width),96vw);
      padding:clamp(10px,3vmin,40px);
      display:grid;
      grid-template-rows:auto auto auto;
      row-gap:clamp(8px,1.6vmin,16px);
      justify-items:center;
      text-align:center;
      position:relative;
      z-index:1; /* nad SVG */
    }

    h1{
      margin:clamp(12px,2vmin,20px) 0 0;
      font-weight:800;
      font-size:clamp(28px,6.2vmin,64px);
      line-height:1.06;
    }
    .sub{
      margin:.6em 0 0;
      color:var(--muted);
      font-size:clamp(16px,3vmin,28px);
    }

    /*
      GRID upraven tak, aby byly vždy 5 sloupců (jedna řada),
      každý sloupec zabere stejnou šířku kontejneru → bez posuvníku.
    */
    .grid{
      margin-top:clamp(4px,1vmin,10px);
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:var(--gap);
      width:100%;
      align-items:start;
      justify-items:center;
    }

    .cell{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(6px,1.2vmin,12px);
      width:100%;
    }

    /* tlačítko zabere celý sloupec, je čtvercové díky aspect-ratio */
    .btn{
      width:100%;
      aspect-ratio: 1 / 1;
      border:none;
      cursor:pointer;
      border-radius:var(--radius);
      background:var(--tile-bg);
      box-shadow:0 0 0 1px var(--tile-border);
      display:grid;
      place-items:center;
      transition:transform .06s ease,background .15s,box-shadow .15s;
      will-change:transform;
    }
    .btn:hover{background:var(--tile-bg-hover);}
    .btn:active{transform:scale(.96);}

    /* emoji se dynamicky škáluje podle viewportu / dostupného místa */
    .emoji{
      display:block;
      font-size: clamp(28px, 6.4vmin, calc((100% - 16px) * 0.72));
      line-height:1;
    }
    .face-img{
      width:78%;
      height:78%;
      object-fit:contain;
      pointer-events:none;
      display:block;
    }
    .label{
      color:var(--muted);
      font-size:clamp(12px,1.6vmin,18px);
      white-space:nowrap;
      margin-top:6px;
    }

    /* overlay nad vším aby děkovací okno není za smajlíky */
    .overlay{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      background:rgba(0,0,0,0.55);
      opacity:0;
      pointer-events:none;
      transition:opacity .12s ease;
      z-index:999;
    }
    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .thanks{
      max-width:92vw;
      width:min(1100px,92%);
      padding:clamp(18px,2.6vmin,36px);
      border-radius:clamp(12px,2vmin,24px);
      color:#fff;
      border:2px solid rgba(240,163,68,0.95);
      background:linear-gradient(180deg, rgba(22,16,2,0.98), rgba(16,10,2,0.95));
      box-shadow:0 28px 60px rgba(0,0,0,0.7);
      transform:translateY(0) scale(.98);
      opacity:0;
      transition:transform .14s cubic-bezier(.2,.9,.3,1), opacity .14s;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(8px,1.8vmin,18px);
      text-align:center;
    }
    .overlay.show .thanks{
      transform:translateY(0) scale(1);
      opacity:1;
    }
    .thanks h2{ margin:0; font-weight:900; font-size:clamp(24px,5.5vw,56px); line-height:1.03; }
    .thanks p{ margin:0; color:var(--muted); font-size:clamp(14px,2.2vw,22px); }

    #installBtn{
      position:fixed;
      right:12px;
      bottom:12px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #2a2a2a;
      background:#101010;
      color:#fff;
      font-size:14px;
      display:none;
      z-index:1000;
    }

    /* když se kontejner zúží tak, že by sloupec byl menší než minimum,
       zmenšíme fonty, aby to pořád vypadalo schovaně (nepřidáváme scroll). */
    @media (max-width:520px){
      .grid{ grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .emoji{ font-size: clamp(20px, 8vmin, 72px); }
    }
  </style>
</head>
<body>
  <!-- SVG "mikádo" - ostré trojúhelníky vycházející z horní hrany -->
  <svg class="spikes" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#e7c34d" />
        <stop offset="100%" stop-color="#c79b28" />
      </linearGradient>
      <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#00a651" />
        <stop offset="100%" stop-color="#007a39" />
      </linearGradient>
      <linearGradient id="g3" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#e1b62f" />
        <stop offset="100%" stop-color="#b78f1e" />
      </linearGradient>
    </defs>

    <!-- ostré trojúhelníky (body mimo horní hranu, končí v dolní třetině) -->
    <polygon points="-200,-120  200,520  340,520  900,-120" fill="url(#g3)"/>
    <polygon points="120,-140  360,520  460,520  240,-140" fill="url(#g2)"/>
    <polygon points="520,-180  620,520  560,520  500,-180" fill="url(#g2)"/>
    <polygon points="680,-160  920,520  780,520  700,-160" fill="url(#g1)"/>
    <polygon points="980,-140  1180,520  1060,520  940,-140" fill="url(#g2)"/>
  </svg>

  <main class="container" aria-live="polite">
    <section id="grid" class="grid" aria-label="Hodnocení">
      <div class="cell">
        <button class="btn" data-value="1" title="Velmi nespokojený" aria-label="Hodnocení 1">
          <span class="emoji">😡</span>
        </button>
        <div class="label">Velmi nespokojený</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="2" title="Nespokojený" aria-label="Hodnocení 2">
          <span class="emoji">🙁</span>
        </button>
        <div class="label">Nespokojený</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="3" title="Neutrální" aria-label="Hodnocení 3">
          <span class="emoji">😐</span>
        </button>
        <div class="label">Neutrální</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="4" title="Spokojený" aria-label="Hodnocení 4">
          <span class="emoji">🙂</span>
        </button>
        <div class="label">Spokojený</div>
      </div>
      <div class="cell">
        <button class="btn" data-value="5" title="Velmi spokojený" aria-label="Hodnocení 5">
          <span class="emoji">😁</span>
        </button>
        <div class="label">Velmi spokojený</div>
      </div>
    </section>

    <h1>Ohodnoť dnešní nákup</h1>
    <p class="sub">Jak spokojený/á jsi byl/a s nákupem?</p>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="thanks" role="status" aria-live="polite">
      <h2>Děkujeme za zpětnou vazbu!</h2>
      <p>Tvůj hlas jsme zaznamenali — děkujeme.</p>
    </div>
  </div>

  <button id="installBtn">Instalovat</button>

<script>
/*** Webhook ***/
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxKT5x3dK3TIe77wfnG7tGTkOy7ftzil1hp0loCIVl9IC1sDOLRyenqtj70a4XBmvkb/exec";

/*** UX parametry ***/
const COOLDOWN_MS = 15000;
const THANKS_MS   = 15000;

/*** Outbox (tichý) ***/
const BOX_KEY = "bouda_outbox_pwa";
const readBox = () => JSON.parse(localStorage.getItem(BOX_KEY) || "[]");
const writeBox = (v)=> localStorage.setItem(BOX_KEY, JSON.stringify(v));

let flushing = false;
async function flushBox(){
  if(flushing || !navigator.onLine) return;
  const box = readBox(); if(!box.length) return;
  flushing = true;
  try{
    while(box.length && navigator.onLine){
      const p = box[0];
      await fetch(WEBHOOK_URL, {
        method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain" },
        body: JSON.stringify(p), keepalive:true
      });
      box.shift(); writeBox(box);
    }
  }catch(_){}
  finally{ flushing = false; }
}
window.addEventListener("online", flushBox);

/*** overlay + cooldown ***/
const overlay = document.getElementById('overlay');
const grid    = document.getElementById('grid');
let cooldownUntil = 0;
const canVote = () => performance.now() >= cooldownUntil;
function startCooldown(){ cooldownUntil = performance.now() + COOLDOWN_MS; grid.style.pointerEvents="none"; setTimeout(()=>grid.style.pointerEvents="auto", COOLDOWN_MS); }
function showThanks(){ overlay.classList.add('show'); setTimeout(()=> overlay.classList.remove('show'), THANKS_MS); }

/*** Hlasování ***/
function sendOrQueue(payload){
  if(!navigator.onLine){
    const b = readBox(); b.push(payload); writeBox(b);
  } else {
    fetch(WEBHOOK_URL, {
      method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain" },
      body: JSON.stringify(payload), keepalive:true
    }).catch(() => {
      const b = readBox(); b.push(payload); writeBox(b);
    });
  }
  flushBox();
}
function vote(value){
  if(!canVote()) return;
  startCooldown(); showThanks();
  const payload = { time:new Date().toISOString(), value:Number(value), kiosk:"Bouda-kiosek-Mercury", question:"Ohodnoť dnešní nákup" };
  sendOrQueue(payload);
}
document.querySelectorAll('.btn').forEach(b=> b.addEventListener('click', ()=> vote(b.dataset.value), {passive:true}));

/*** Fullscreen + WakeLock po prvním kliknutí ***/
async function enterFullscreenAndWake() {
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch(_) {}
  try {
    if ('wakeLock' in navigator) {
      window._wl = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async ()=>{
        if (document.visibilityState === 'visible') {
          try { window._wl = await navigator.wakeLock.request('screen'); } catch(_){}
        }
      });
    }
  } catch(_) {}
}
document.addEventListener('click', function once(){
  enterFullscreenAndWake();
  document.removeEventListener('click', once, {capture:true});
}, {capture:true, once:true});

/*** PWA: registrace SW ***/
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

/*** PWA: tlačítko „Instalovat“ ***/
let defPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  defPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async ()=>{
  if(!defPrompt) return;
  defPrompt.prompt();
  await defPrompt.userChoice;
  defPrompt = null;
  installBtn.style.display = 'none';
});

/*** první tichý flush po startu ***/
flushBox();

/*** Dynamické face1–face5 (fallback na emoji) ***/
(function setupFaces(){
  const exts = ['.png','.webp','.jpg','.jpeg','.svg'];
  document.querySelectorAll('.btn').forEach(btn=>{
    const val = btn.dataset.value;
    const emojiSpan = btn.querySelector('.emoji');
    if(!emojiSpan) return;

    (async () => {
      for(const ext of exts){
        const src = `face${val}${ext}`;
        const ok = await new Promise(res=>{
          const img = new Image();
          img.onload = ()=>res(true);
          img.onerror = ()=>res(false);
          img.src = src;
        });
        if(ok){
          const imgEl = document.createElement('img');
          imgEl.src = src;
          imgEl.alt = `Hodnocení ${val}`;
          imgEl.className = 'face-img';
          emojiSpan.replaceWith(imgEl);
          break;
        }
      }
      // když nic nenajdeme, emoji zůstane
    })();
  });
})();

/* ========= ROBUSTNÍ ZÁMEK ZPĚT + AUTO OBNOVA + FULLSCREEN ========= */

/* 0) Pomocný flag pro PWA (instalovaná vs. prohlížeč) */
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || (window.navigator.standalone === true);

/* 1) Vynucený hash, aby historie měla co „držet“ */
(function ensureHash(){
  if (!location.hash) {
    history.replaceState(null, '', location.pathname + '#home');
  }
})();

/* 2) Pevné „vycpání“ historie (2 položky) a tvrdé vracení vpřed */
function hardenBackLock() {
  try {
    if (!sessionStorage.getItem('backArmed')) {
      history.pushState({b:1}, '');
      history.pushState({b:2}, '');
      sessionStorage.setItem('backArmed','1');
    }
  } catch(_) {}
  window.addEventListener('popstate', (e)=>{
    // nedovolit odejít zpět – skoč rovnou dopředu
    try { history.go(1); } catch(_) {}
    // pro jistotu historii zase „dotuč“
    try { history.pushState({b:3}, ''); } catch(_) {}
  });
}
window.addEventListener('load', hardenBackLock);

/* 3) Držet fullscreen vždy, když se appka zviditelní */
async function ensureFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
  } catch(_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') ensureFullscreen();
});
window.addEventListener('pageshow', () => {
  // po návratu z BFCache znovu vycpeme historii a fullscreen
  hardenBackLock();
  ensureFullscreen();
});

/* 4) Watchdog: když se náhodou dostaneme na splash/mezistav,
      rychle a potichu obnov domovskou obrazovku */
let lastUserTick = performance.now();
document.addEventListener('pointerdown', ()=> lastUserTick = performance.now(), {passive:true});
document.addEventListener('keydown',     ()=> lastUserTick = performance.now(), {passive:true});

function softRecover(){
  // Pokud jsme „viditelní“, ale UI není interaktivní, přepíšeme url zpět na #home
  if (document.visibilityState === 'visible' && document.readyState !== 'loading') {
    if (!location.hash || location.hash !== '#home') {
      history.replaceState(null, '', location.pathname + '#home');
    }
    hardenBackLock();
    ensureFullscreen();
  }
}
document.addEventListener('visibilitychange', softRecover);
setInterval(softRecover, 1200); // jemný watchdog každých ~1.2 s

/* 5) (Volitelné) Zablokovat Backspace/Escape jako „zpět“ v některých klávesnicích */
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Backspace' || e.key === 'Escape') {
    e.preventDefault();
  }
}, {passive:false});
</script>

<script>
// 1) Zruš context menu, výběr, drag & drop
addEventListener('contextmenu', e => e.preventDefault(), {capture:true});
addEventListener('selectstart', e => e.preventDefault(), {capture:true});
addEventListener('dragstart',  e => e.preventDefault(), {capture:true});
addEventListener('copy',       e => e.preventDefault(), {capture:true});
addEventListener('cut',        e => e.preventDefault(), {capture:true});
addEventListener('paste',      e => e.preventDefault(), {capture:true});

// 2) Zneškodni odkazy a okna
addEventListener('click', e => {
  const a = e.target.closest('a, [role="link"], [onclick]');
  if (a) e.preventDefault();
}, {capture:true});
window.open = function(){ return null; };

// 3) Tvrdé „Back lock“ + auto-recovery (redundant safety)
(function(){
  try { for (let i=0;i<8;i++) history.pushState({k:i}, ''); } catch(_){}
  addEventListener('popstate', e=>{ try{ history.go(1); }catch(_){ } }, {capture:true});
  if (!location.hash) { try { history.replaceState(null, '', location.pathname + '#home'); } catch(_){ } }
  const recover=()=>{ if (document.visibilityState==='visible') {
    try { history.replaceState(null, '', location.pathname + '#home'); } catch(_){ }
  }};
  addEventListener('visibilitychange', recover);
  setInterval(recover, 1000);
})();
</script>

</body>
</html>
